name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src_payload_v7/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reconstruct v7.0.1 source
        run: python tools/reconstruct_source.py

      - name: Patch v7.1.0 audio compatibility layer
        run: python tools/patch_v710.py

      - name: Syntax check
        run: python -m py_compile mp3_organizer_v7_1_0.py

      - name: Smoke test PySide6 UI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python mp3_organizer_v7_1_0.py --smoke-test

      - name: Test fake-MP3 detection and conversion
        shell: pwsh
        run: |
          @'
          import importlib.util
          import subprocess
          from pathlib import Path
          import imageio_ffmpeg

          spec = importlib.util.spec_from_file_location('organizer', 'mp3_organizer_v7_1_0.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          fake = Path('compatibility_test.mp3')
          subprocess.check_call([
              ffmpeg, '-nostdin', '-hide_banner', '-loglevel', 'error', '-y',
              '-f', 'lavfi', '-i', 'sine=frequency=440:duration=1',
              '-c:a', 'aac', '-f', 'mp4', str(fake)
          ])
          before = mod.inspect_audio_health(fake)
          assert before['state'] == 'convert', before
          mod.convert_to_compatible_mp3(fake)
          after = mod.inspect_audio_health(fake)
          assert after['state'] == 'compatible', after
          print('Audio compatibility smoke test passed:', before['format'], '->', after['format'])
          '@ | Set-Content -Encoding utf8 test_audio_compat.py
          python test_audio_compat.py

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Organizer-v7.1.0-source
          path: mp3_organizer_v7_1_0.py
          if-no-files-found: error
          retention-days: 7

      - name: Create Windows icon
        shell: pwsh
        run: |
          @'
          from PIL import Image, ImageDraw
          im = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((12, 12, 244, 244), radius=58, fill=(0, 122, 255, 255))
          d.ellipse((70, 146, 126, 202), fill='white')
          d.rounded_rectangle((112, 62, 132, 174), radius=8, fill='white')
          d.polygon([(128, 62), (194, 47), (194, 79), (128, 94)], fill='white')
          im.save('app.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 make_icon.py
          python make_icon.py

      - name: Create Windows version metadata
        shell: pwsh
        run: |
          @'
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(7,1,0,0),
              prodvers=(7,1,0,0),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0,0)
            ),
            kids=[
              StringFileInfo([
                StringTable(
                  u'040904B0',
                  [
                    StringStruct(u'CompanyName', u'WenZurich'),
                    StringStruct(u'FileDescription', u'MP3 Organizer'),
                    StringStruct(u'FileVersion', u'7.1.0'),
                    StringStruct(u'InternalName', u'MP3 Organizer'),
                    StringStruct(u'OriginalFilename', u'MP3 Organizer.exe'),
                    StringStruct(u'ProductName', u'MP3 Organizer'),
                    StringStruct(u'ProductVersion', u'7.1.0')
                  ]
                )
              ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          '@ | Set-Content -Encoding utf8 version_info.txt

      - name: Build single-file Windows app
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "MP3 Organizer" `
            --icon app.ico `
            --version-file version_info.txt `
            --collect-all imageio_ffmpeg `
            mp3_organizer_v7_1_0.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\MP3 Organizer.exe')) { throw 'EXE was not produced.' }
          Get-Item 'dist\MP3 Organizer.exe' | Format-List Name,Length,LastWriteTime

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Organizer-Windows-x64-v7.1.0
          path: dist/MP3 Organizer.exe
          if-no-files-found: error
          retention-days: 30
